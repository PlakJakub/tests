<!doctype html>
<html lang="pl">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Camera" />
    <meta name="description" content="Minimalistyczny zegar i aparat." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <title>Camera</title>
  </head>
  <body>
    <dialog id="api-key-dialog" class="api-key-dialog" aria-labelledby="api-key-title">
      <form id="api-key-form" class="api-key-form">
        <h1 id="api-key-title">Klucz API OpenAI</h1>
        <label for="api-key-input">Wprowadź klucz, aby włączyć odczyt i rozwiązywanie pytań.</label>
        <input id="api-key-input" name="apiKey" type="password" autocomplete="off" spellcheck="false" />
        <div class="api-key-actions">
          <button class="button button-secondary" id="skip-api-key" type="button">PÓŹNIEJ</button>
          <button class="button" type="submit">ZAPISZ KLUCZ</button>
        </div>
      </form>
    </dialog>
    <main id="app">
      <section id="clock-screen" class="screen clock-screen" aria-label="Zegar">
        <time id="clock" class="clock" aria-live="off">00:00</time>
        <section id="clock-answer-panel" class="clock-answer-panel" aria-label="Gotowe odpowiedzi" hidden>
          <ol id="clock-answers" class="clock-answers"></ol>
        </section>
      </section>

      <section id="camera-screen" class="screen camera-screen" aria-label="Aparat" hidden>
        <video id="camera-preview" autoplay muted playsinline></video>
        <button id="open-settings" class="button button-secondary camera-clear-button" type="button" aria-label="Ustawienia" title="Ustawienia">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.8" />
            <path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1)" />
          </svg>
        </button>
        <div class="camera-controls">
          <button id="take-photo" class="button" type="button">ZRÓB ZDJĘCIE I ODCZYTAJ</button>
          <button id="preview-answers" class="button button-secondary" type="button">PODGLĄD ODPOWIEDZI</button>
          <div class="camera-actions-row">
            <button id="cancel-camera" class="button button-secondary" type="button">POWRÓT</button>
          </div>
        </div>
      </section>

      <section id="settings-screen" class="screen settings-screen" aria-label="Ustawienia" hidden>
        <header class="settings-header">
          <h1>Ustawienia</h1>
          <p>Wybierz model używany do odczytu zdjęć i rozwiązywania pytań.</p>
        </header>
        <label class="settings-field" for="model-select">
          <span>Model OpenAI</span>
          <select id="model-select" class="settings-select"></select>
        </label>
        <p id="settings-status" class="settings-status" aria-live="polite"></p>
        <div class="settings-actions">
          <button id="clear-answers" class="button button-danger" type="button">WYCZYŚĆ ODPOWIEDZI</button>
          <button id="return-from-settings" class="button button-secondary" type="button">WRÓĆ DO APARATU</button>
        </div>
      </section>

      <section id="results-screen" class="screen results-screen" aria-label="Odczytane pytania" hidden>
        <header class="results-header">
          <h1>Odczytane pytania</h1>
          <p>Zdjęcia są przetwarzane w tle. Lista opcji A–D oraz rozwiązania łączą się i są sortowane rosnąco po ID.</p>
          <p id="processing-status" class="processing-status" aria-live="polite"></p>
        </header>
        <ol id="extracted-questions" class="extracted-questions"></ol>
        <button id="add-photo" class="button button-secondary" type="button">DODAJ NASTĘPNE ZDJĘCIE</button>
        <button id="return-from-results" class="button" type="button">WRÓĆ DO ZEGARA</button>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
