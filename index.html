<!doctype html>
<html lang="pl">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Camera" />
    <meta name="description" content="Minimalistyczny zegar i aparat." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <title>Camera</title>
  </head>
  <body>
    <main id="app">
      <section id="clock-screen" class="screen clock-screen" aria-label="Zegar">
        <time id="clock" class="clock" aria-live="off">00:00</time>
        <p id="clock-error" class="message" role="alert" hidden></p>
      </section>

      <section id="camera-screen" class="screen camera-screen" aria-label="Aparat" hidden>
        <video id="camera-preview" autoplay muted playsinline></video>
        <p id="camera-error" class="message camera-message" role="alert" hidden></p>
        <div class="camera-controls">
          <button id="take-photo" class="button" type="button">ZRÓB ZDJĘCIE</button>
          <button id="cancel-camera" class="button button-secondary" type="button">POWRÓT</button>
        </div>
      </section>

      <section id="results-screen" class="screen results-screen" aria-label="Wyniki" hidden>
        <ol id="results-list" class="results-list" aria-label="Odpowiedzi"></ol>
        <button id="return-to-clock" class="button button-secondary results-return" type="button">WRÓĆ DO ZEGARA</button>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
